name: Main-only check
on:
  pull_request:
    branches: [ main ]
permissions: {}
jobs:
  check:
    name: Main-only check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stand-in check
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          FAIL_BRANCHES: ${{ vars.FAIL_MAIN_ONLY }}
        run: |
          echo "base=$BASE_REF head=$HEAD_REF"
          if [[ ",$FAIL_BRANCHES," == *",$HEAD_REF,"* ]]; then echo "forced failure"; exit 1; fi
